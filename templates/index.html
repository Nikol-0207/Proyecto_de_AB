<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
</head>
<body>
    
    <main class="contenedor-principal">

    <div class="fila-controles">  

    <section class="panel columna-expresiones">
       <h1>Árbol de Expresiones</h1>
       
       <label for="notacion">Escoja la notación: </label>
       <select name="notacion" id="notacion">
        <option value="1">Infijo</option>
        <option value="2">Postfijo</option>
        <option value="3">Prefijo</option>
       </select>
       <section class="calculo-exp">
              <button id="btn-calcular" type="button">Calcular</button>
              <input type="text" id="input-expresion" placeholder="Escribe la expresión...">
              <label for="result-exp">Resultados:</label>
              <input type="text" name="result-exp" id="result-exp" readonly>
        </section>
         <button id="show-tree" type="button">Mostrar Árbol</button>
          <button id="exp-inorden" type="button">InOrden</button>
          <button id="exp-preorden" type="button">PreOrden</button>
          <button id="exp-postorden" type="button">PostOrden</button>
          <label for="result-exp-rec">Resultado R.: </label>
          <input type="text" name="result-exp-rec" id="result-exp-rec" readonly>
    </section>
    <section class="panel columna-metodos">
        <h1>Métodos de Árbol Binarios</h1>
       <div class="campo">
          <label for="insert-nodo">Insertar Nodo:</label>
          <div class="acciones-nodo">
            <input type="text" id="insert-nodo" placeholder="Valor del nodo">
            <button id="btn-insertar">Insertar</button>
            <button id="btn-eliminar">Eliminar</button>
          </div>
        </div>
         <label for="Busqueda">Buscar:</label>
         <input type="text" name="Busqueda">
       <button id="btn-inorden" type="button">InOrden</button>
        <button id="btn-preorden" type="button">PreOrden</button>
        <button id="btn-postorden" type="button">PostOrden</button>
          <label for="Recorrido">Resultado R.: </label>
          <input type="text" name="Recorrido" id="result-record">
        </section>
        </div>  
        <section class="area-visualizador">
      <canvas id="main-canvas" width="1100" height="420"></canvas>
    </section>
   </main>
    
   <footer class="app-footer">
    <small>&copy; 2026 Proyecto Árboles Binarios Todos los derechos reservados.</small>
</footer>
     <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
